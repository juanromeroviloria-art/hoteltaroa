{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }} | Hotel Taroa</title>
    <link rel="stylesheet" href="{% static 'css/huespedes.css' %}">
</head>
<body>
<main class="formulario">
    <h1>{{ titulo }}</h1>
    <p>Ingresa los datos del huésped.</p>

    <form method="post">
        {% csrf_token %}

        {% for field in form %}
        <div class="campo">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}

            {% if field.errors %}
                <div class="error">{{ field.errors }}</div>
            {% endif %}
        </div>
        {% endfor %}

        {% if form.non_field_errors %}
            <div class="error">{{ form.non_field_errors }}</div>
        {% endif %}

        <div class="botones">
            <button type="submit" class="btn principal">{{ boton }}</button>
            <a href="{% url 'huespedes' %}" class="btn secundario">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
