<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi perfil | Hotel Taroa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container py-5">
        <div class="card shadow-sm mx-auto" style="max-width: 680px">
            <div class="card-body p-4">
                <a href="{% url 'panel' %}" class="btn btn-link px-0">← Volver</a>
                <h1 class="h3 mb-4">Mi perfil</h1>
                {% if messages %}{% for message in messages %}
                    <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
                {% endfor %}{% endif %}
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label" for="first_name">Nombres</label>
                        <input class="form-control" id="first_name" name="first_name" value="{{ request.user.first_name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="last_name">Apellidos</label>
                        <input class="form-control" id="last_name" name="last_name" value="{{ request.user.last_name }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="email">Correo</label>
                        <input class="form-control" id="email" name="email" type="email" value="{{ request.user.email }}" required>
                    </div>
                    {% if huesped %}
                        <p class="text-secondary">Documento: {{ huesped.tipo_documento }} {{ huesped.numero_documento }}</p>
                        <div class="mb-3">
                            <label class="form-label" for="telefono">Teléfono</label>
                            <input class="form-control" id="telefono" name="telefono" value="{{ huesped.telefono }}" required>
                        </div>
                    {% endif %}
                    <button class="btn btn-primary" type="submit">Guardar perfil</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
