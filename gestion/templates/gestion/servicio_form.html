{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/servicios.css' %}">

<div class="formulario-contenedor">
    <h1>{{ titulo }}</h1>
    <p>Completa la información del servicio.</p>

    <form method="post">
        {% csrf_token %}

        {% for field in form %}
            <div class="campo-formulario">
                <label for="{{ field.id_for_label }}">
                    {{ field.label }}
                </label>

                {{ field }}

                {% if field.errors %}
                    <div class="error-formulario">
                        {{ field.errors }}
                    </div>
                {% endif %}
            </div>
        {% endfor %}

        <div class="botones-formulario">
            <button type="submit" class="btn-principal">
                {{ boton }}
            </button>

            <a href="{% url 'servicios' %}" class="btn-secundario">
                Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
